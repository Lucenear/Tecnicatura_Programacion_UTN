<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Store</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="contenedor-login">
        <form class="tarjeta-formulario">
            <h1>FOOD STORE</h1>
            <p class="texto-subtitulo">Iniciar Sesion</p>

            <div class="grupo-input">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
            </div>

            <div class="grupo-input">
                <label for="password">Contrasena:</label>
                <input type="password" id="password" name="password" placeholder="Minimo 8 caracteres" required>
            </div>

            <button type="submit" class="boton-ingresar">INGRESAR</button>

            <p class="footer-formulario">
                ¿No tenes cuenta? <a href="#">Registrate aca</a>
            </p>
        </form>
    </div>
</body>
</html>
