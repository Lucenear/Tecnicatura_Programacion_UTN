<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Store</title>
    <link rel="stylesheet" href="../../../style.css">
    <script type="module" src="../../../main.ts"></script>
</head>

<body>
    <div class="contenedor-login">
        <form class="tarjeta-formulario" id="form-login">
            <h1>FOOD STORE</h1>
            <p class="texto-subtitulo">Iniciar Sesión</p>

            <div class="grupo-input">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
            </div>

            <div class="grupo-input">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="boton-ingresar">INGRESAR</button>

            <p class="footer-formulario">
                ¿No tenés cuenta? <a href="../registro/registro.html">Registrate acá</a>
            </p>
        </form>
    </div>
    <footer>
        <p>&copy; 2026 Food Store. Todos los derechos reservados.</p>
        <p>Contacto: info@foodstore.com.ar</p>
    </footer>
    <script type="module" src="./login.ts"></script>
</body>

</html>
