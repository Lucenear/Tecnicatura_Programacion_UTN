<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Mis Pedidos</title>
    <link rel="stylesheet" href="../../../style.css">
    <style>
        .order-card {
            background: var(--color-blanco);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--color-borde);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        .order-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .detail-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 0;
        }
        .detail-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }
        .detail-item p {
            margin: 0;
            font-size: 0.9rem;
        }
    </style>
    <script type="module" src="../../../main.ts"></script>
</head>
<body>
    <header>
        <div class="logo">Food<span>Store</span></div>
        <nav>
            <a href="../../store/home/index.html">Catálogo</a>
            <a href="#" class="active">Mis Pedidos</a>
            <a href="../../store/cart/index.html">Carrito</a>
            <a id="logoutButton" style="color: var(--color-primario); font-weight: 700;">Cerrar Sesión</a>
        </nav>
    </header>

    <div id="app" style="max-width: 1000px; margin: 0 auto; width: 100%;">
        <main>
            <h2 style="margin-bottom: 2rem;">Historial de Pedidos</h2>
            <div id="orders-container">
                <!-- Orders loaded here -->
            </div>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Food Store. Todos los derechos reservados.</p>
    </footer>

    <script type="module" src="./main.ts"></script>
</body>
</html>
