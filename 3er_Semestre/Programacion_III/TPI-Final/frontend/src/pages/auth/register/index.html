<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Registro</title>
    <link rel="stylesheet" href="../../../style.css">
    <script type="module" src="../../../main.ts"></script>
</head>
<body>
    <div id="app" class="auth-container">
        <div class="auth-card">
            <h2>Crear Cuenta</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" required placeholder="Tu apellido">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="celular">Celular</label>
                    <input type="tel" id="celular" required placeholder="Tu número">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="Mínimo 6 caracteres">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Registrarse</button>
            </form>
            <div class="footer-formulario" style="text-align: center;">
                <p>¿Ya tienes cuenta? <a href="../login/index.html" style="color: var(--color-primario);">Inicia sesión aquí</a></p>
            </div>
        </div>
    </div>
    <script type="module" src="./main.ts"></script>
</body>
</html>
